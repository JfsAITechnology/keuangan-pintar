name: Validate Keuangan Pintar

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Static validation
        run: node scripts/validate.mjs
      - name: Runtime contract
        run: node scripts/runtime-contract.mjs
